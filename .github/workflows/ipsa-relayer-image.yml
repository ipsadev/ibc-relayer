name: ipsa relayer image

on:
  push:
    branches: [feat/stellar-chain-type]
    tags: ["stellar-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to build; empty = the ref the run started from"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ipsa-relayer-image-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: set up go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: test the packages the Stellar corridor uses
        run: go test ./shared/... ./relayer/ibcv2/... ./cmd/...

  build:
    name: build & push by digest (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: resolve image name
        run: |
          image="$(printf '%s' "${{ vars.RELAYER_IMAGE }}" | tr -d '[:space:]')"
          if [ -z "$image" ]; then
            echo "::error::the RELAYER_IMAGE repository variable is not set"
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.relayer
          platforms: ${{ matrix.platform }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=relayer-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=relayer-${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-relayer-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest & push tags
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-relayer-*
          merge-multiple: true

      - name: resolve image name and tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="$(printf '%s' "${{ vars.RELAYER_IMAGE }}" | tr -d '[:space:]')"
          if [ -z "$image" ]; then
            echo "::error::the RELAYER_IMAGE repository variable is not set"
            exit 1
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"

          short="$(printf '%s' "${{ github.sha }}" | cut -c1-12)"
          tags="-t $image:sha-$short"
          if [ "$REF_TYPE" = "tag" ]; then
            tags="$tags -t $image:$REF_NAME -t $image:latest"
          else
            branch="$(printf '%s' "$REF_NAME" | sed 's/[^a-zA-Z0-9.-]/-/g')"
            tags="$tags -t $image:$branch"
          fi
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$SHORT_SHA"
          {
            echo "## Relayer image"
            echo
            echo "\`$IMAGE:sha-$SHORT_SHA\`"
            echo
            echo "Pin it with \`RELAYER_TAG=sha-$SHORT_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
